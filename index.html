<!DOCTYPE html>
<html lang="ko">
<head>
<script>if(Math.min(screen.width, window.innerWidth) < 700) location.replace('app.html' + location.search);</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poo-riend 미리보기</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* VOICE: plain, monochrome
   IDEA: a sheet of paper with two views of the same app
   PICTURE: the running app itself, phone-sized or desktop-sized
   COLOUR and TYPE: white, black ink; Gochi Hand for the mark, Gmarket Sans for text
   LAYOUT: tabs on top, the selected view centred and scaled to fit */
:root{color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#fff;color:#111;font:15px/1.4 'Gmarket Sans',system-ui,sans-serif}
.top{display:flex;align-items:center;gap:18px;padding:14px 20px 10px;flex-wrap:wrap}
.mark{font-family:'Slackey','Gmarket Sans',system-ui,sans-serif;font-size:26px;line-height:1;letter-spacing:.5px}
.tabs{display:flex;gap:6px}
.tabs button{font:inherit;font-size:15px;background:none;border:1.8px solid transparent;border-radius:999px;padding:7px 18px;cursor:pointer;color:#707070;min-height:40px}
.tabs button[aria-selected=true]{color:#111;border-color:#111}
.tabs button:focus-visible{outline:2px solid #111;outline-offset:3px}
.note{font-size:12px;color:#707070;margin-left:auto}
.stage{position:relative;height:calc(100vh - 66px);overflow:hidden}
.view{position:absolute;inset:0;display:none;align-items:flex-start;justify-content:center;padding:6px 12px 16px}
.view.on{display:flex}
.box{position:relative;transform-origin:top center;flex:none}
.phone{width:390px;height:844px;border-radius:30px;overflow:hidden;background:#fff}
.desk{width:1180px;height:760px;border-radius:18px;overflow:hidden;background:#fff}
iframe{display:block;width:100%;height:100%;border:0}
.hand{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:visible}
@media(max-width:600px){.note{display:none}}
</style>
<link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>
<div class="top">
  <span class="mark">Poo-riend</span>
  <div class="tabs" role="tablist">
    <button role="tab" id="t-m" aria-selected="true" data-v="m">모바일</button>
    <button role="tab" id="t-d" aria-selected="false" data-v="d">PC</button>
  </div>
</div>
<div class="stage" id="stage">
  <div class="view on" id="v-m"><div class="box phone" id="b-m"><iframe src="app.html" title="모바일 미리보기"></iframe></div></div>
  <div class="view" id="v-d"><div class="box desk" id="b-d"><iframe src="app.html" title="PC 미리보기"></iframe></div></div>
</div>
<script>
{
  const stage = document.getElementById('stage');
  /* hand-drawn outline, one closed line with a gentle wobble */
  const handRect = (w, h, r, seed) => {
    const pts = [], n = 180, per = 2 * (w - 2 * r) + 2 * (h - 2 * r) + 2 * Math.PI * r;
    const pt = (s) => {
      const segs = [w - 2 * r, Math.PI * r / 2, h - 2 * r, Math.PI * r / 2, w - 2 * r, Math.PI * r / 2, h - 2 * r, Math.PI * r / 2];
      let i = 0; while(i < 7 && s > segs[i]){ s -= segs[i]; i++; }
      const a = (k, cx, cy) => [cx + r * Math.cos(k), cy + r * Math.sin(k), Math.cos(k), Math.sin(k)];
      switch(i){
        case 0: return [r + s, 0, 0, -1];
        case 1: return a(-Math.PI / 2 + s / r, w - r, r);
        case 2: return [w, r + s, 1, 0];
        case 3: return a(s / r, w - r, h - r);
        case 4: return [w - r - s, h, 0, 1];
        case 5: return a(Math.PI / 2 + s / r, r, h - r);
        case 6: return [0, h - r - s, -1, 0];
        default: return a(Math.PI + s / r, r, r);
      }
    };
    for(let i = 0; i < n; i++){
      const u = i / n, p = pt(per * u);
      const off = .55 * Math.sin(6.283 * u * 3 + seed) + .25 * Math.sin(6.283 * u * 7 + seed * 2);
      pts.push([p[0] + p[2] * off, p[1] + p[3] * off]);
    }
    let d = 'M' + ((pts[0][0] + pts[n - 1][0]) / 2).toFixed(1) + ' ' + ((pts[0][1] + pts[n - 1][1]) / 2).toFixed(1);
    for(let i = 0; i < n; i++){
      const a = pts[i], b = pts[(i + 1) % n];
      d += ' Q' + a[0].toFixed(1) + ' ' + a[1].toFixed(1) + ' ' + ((a[0] + b[0]) / 2).toFixed(1) + ' ' + ((a[1] + b[1]) / 2).toFixed(1);
    }
    return d + ' Z';
  };
  for(const [id, w, h, r, seed] of [['b-m', 390, 844, 30, 1.3], ['b-d', 1180, 760, 18, 2.1]]){
    const box = document.getElementById(id);
    box.insertAdjacentHTML('beforeend', '<svg class="hand" viewBox="-4 -4 ' + (w + 8) + ' ' + (h + 8) + '" style="inset:-4px;width:calc(100% + 8px);height:calc(100% + 8px)"><path d="' + handRect(w, h, r, seed) + '" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>');
    box.style.overflow = 'visible';
    box.querySelector('iframe').style.borderRadius = r + 'px';
  }
  const fit = () => {
    const W = stage.clientWidth - 24, H = stage.clientHeight - 22;
    const m = document.getElementById('b-m'), d = document.getElementById('b-d');
    m.style.transform = 'scale(' + Math.min(1, W / 390, H / 844) + ')';
    d.style.transform = 'scale(' + Math.min(1, W / 1180, H / 760) + ')';
  };
  const ro = new ResizeObserver(fit);
  ro.observe(stage);
  for(const b of document.querySelectorAll('.tabs button')){
    b.addEventListener('click', () => {
      for(const x of document.querySelectorAll('.tabs button')) x.setAttribute('aria-selected', String(x === b));
      document.getElementById('v-m').classList.toggle('on', b.dataset.v === 'm');
      document.getElementById('v-d').classList.toggle('on', b.dataset.v === 'd');
      fit();
    });
  }
  fit();
}
</script>
</body>
</html>
